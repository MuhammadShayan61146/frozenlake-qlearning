# Render Blueprint: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: frozen-lake-lab
    runtime: python
    plan: free
    buildCommand: pip install -r requirements-server.txt
    startCommand: uvicorn backend:app --host 0.0.0.0 --port $PORT --workers 1 --proxy-headers --forwarded-allow-ips="*"
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: FLL_MAX_TRAINING
        value: "2"
